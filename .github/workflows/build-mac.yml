# Builds the macOS .dmg on a GitHub-hosted Mac, because electron-builder cannot
# produce one from Windows — codesign and hdiutil are Apple-only binaries.
#
# Run it from the repo's Actions tab, then download the artifact.
name: build-mac

on:
  workflow_dispatch:        # manual — this is not something to run on every push

jobs:
  dmg:
    runs-on: macos-latest   # Apple silicon runner; the universal target covers Intel too
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build the dmg
        run: npm run dist:mac
        env:
          # unsigned build — without this electron-builder looks for a Developer ID
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: Parenchyma-Measure-mac
          path: release/*.dmg
          if-no-files-found: error
